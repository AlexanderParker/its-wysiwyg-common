name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Trusted publishing: GitHub mints an OIDC token that npm exchanges for
  # publish rights, so there is no NPM_TOKEN to store or rotate.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node 22.14 or later.
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # The npm bundled with Node 22 predates trusted publishing, which needs
      # npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Provenance is attached automatically when publishing this way, so the
      # explicit flag is no longer needed.
      - name: Publish
        run: npm publish --access public
