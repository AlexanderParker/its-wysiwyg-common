name: Release

on:
  push:
    tags:
      - "v*"
  # Lets a failed release be retried without moving or recreating the tag.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # registry-url is deliberately NOT set here. It makes setup-node write
          # an .npmrc containing a placeholder auth token, which npm then uses
          # in preference to the OIDC exchange. The publish authenticates as
          # nobody and the registry answers 404, because it reports an
          # unauthorised write as a missing package.

      - name: Install dependencies
        run: npm ci

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
